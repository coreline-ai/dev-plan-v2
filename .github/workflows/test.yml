name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - run: python -m compileall -q scripts tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
      - if: matrix.python-version == '3.12'
        run: python -m pip install skills-ref==0.1.1
      - if: matrix.python-version == '3.12'
        run: |
          cp -R . "${RUNNER_TEMP}/parallel-dev-plan-orchestrator"
          agentskills validate "${RUNNER_TEMP}/parallel-dev-plan-orchestrator"
